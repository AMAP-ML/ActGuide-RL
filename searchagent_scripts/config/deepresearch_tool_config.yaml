tools:

  - class_name: verl.tools.deepresearch_tool.SearchTool
    config:
      type: native
      url: http://127.0.0.1:8010/search
      num_workers: 120
      rate_limit: 120
      timeout: 30
    tool_schema:
      type: function
      function:
        name: search
        description: Perform Google web searches then returns a string of the top search results. Accepts multiple queries.
        parameters:
          type: object
          properties:
            query:
              type: array
              items:
                type: string
                description: The search query.
              minItems: 1
              description: The list of search queries.
          required:
            - query

  - class_name: verl.tools.deepresearch_tool.VisitTool
    config:
      type: native
      url: http://127.0.0.1:8010/visit
      num_workers: 120
      rate_limit: 60
      timeout: 50
      max_repeat_per_url_goal: 2
    tool_schema:
      type: function
      function:
        name: visit
        description: Visit webpage(s) and return the summary of the content.
        parameters:
          type: object
          properties:
            url:
              type: array
              items:
                type: string
              description: The URL(s) of the webpage(s) to visit. Can be a single URL or an array of URLs.
            goal:
              type: string
              description: The specific information goal for visiting webpage(s).
          required:
            - url
            - goal