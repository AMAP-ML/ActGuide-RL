# Nginx 反向代理：将本机 8000 端口按路径转发到多后端
# 用法: nginx -c /path/to/nginx_8000.conf
# 或放入 /etc/nginx/conf.d/ 后 nginx -s reload
#
# 路径约定:
#   /tools/   -> 127.0.0.1:8010  (DeepResearch search/visit)
#   /reward1/ -> 127.0.0.1:7001  (Reward vLLM 1)
#   /reward2/ -> 127.0.0.1:7002  (Reward vLLM 2)

worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    # 上游：DeepResearch 工具服务 (search/visit)
    upstream backend_tools {
        server 127.0.0.1:8010;
    }
    # 上游：Reward 模型服务
    upstream backend_reward1 {
        server 127.0.0.1:7001;
    }
    upstream backend_reward2 {
        server 127.0.0.1:7002;
    }

    server {
        listen 8000;
        server_name _;

        # /tools/search, /tools/visit -> 8010
        location /tools/ {
            proxy_pass http://backend_tools/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # /reward1/v1/... -> 7001/v1/...
        location /reward1/ {
            proxy_pass http://backend_reward1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # /reward2/v1/... -> 7002/v1/...
        location /reward2/ {
            proxy_pass http://backend_reward2/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location / {
            return 404 '{"error":"use /tools/ or /reward1/ or /reward2/"}\n';
            add_header Content-Type application/json;
        }
    }
}
